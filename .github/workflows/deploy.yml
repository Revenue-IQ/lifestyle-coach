# Builds the app image, pushes it to GitHub's container registry, then deploys it to the
# Lightsail instance over SSH. Why it is shaped this way: docs/architecture/deployment.md.
#
# Repository settings this needs (Settings → Secrets and variables → Actions):
#   Secrets:   LIGHTSAIL_HOST (the static IP), LIGHTSAIL_SSH_KEY (private key of the deploy key pair),
#              POSTGRES_PASSWORD (letters and digits; never change it after the first deploy),
#              CLERK_SECRET_KEY (required unless AUTH_MODE is dev), GEMINI_API_KEY (optional; empty
#              switches the coach off)
#   Variables: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY (Clerk's publishable key; a secret of the same
#              name also works; leave unset for the built-in dev sign-in), AUTH_MODE (optional,
#              default clerk; dev for the built-in sign-in), LIGHTSAIL_USER (optional, default
#              ubuntu), EXTRA_ENV (optional extra lines for the server env file, for example
#              GEMINI_TEXT_MODEL overrides)
# The deploy job writes /opt/wellbeing/.env on the server from these on every run.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry names must be lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The web build and the API must agree on sign-in: a bundle with no publishable key shows
      # the developer sign-in, which an API in Clerk mode rejects, and the other way round.
      - name: Check the sign-in settings agree
        env:
          PK: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          AUTH_MODE: ${{ vars.AUTH_MODE || 'clerk' }}
        run: |
          if [ "$AUTH_MODE" != dev ] && [ -z "$PK" ]; then
            echo "::error::EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY is not set (as a repository variable or secret) but AUTH_MODE is not dev: the app would show the developer sign-in and the API would reject it. Set the key, or set the AUTH_MODE variable to dev."
            exit 1
          fi
          if [ "$AUTH_MODE" = dev ] && [ -n "$PK" ]; then
            echo "::error::AUTH_MODE is dev but EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY is set: the app would use Clerk and the API would reject its tokens. Remove one of them."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            EXPO_PUBLIC_API_URL=
            EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Lightsail
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy settings exist
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          PGPASS: ${{ secrets.POSTGRES_PASSWORD }}
          CLERK: ${{ secrets.CLERK_SECRET_KEY }}
          AUTH_MODE: ${{ vars.AUTH_MODE || 'clerk' }}
        run: |
          ok=1
          where="(Settings → Secrets and variables → Actions → Repository secrets)"
          [ -n "$HOST" ] || { echo "::error::Repository secret LIGHTSAIL_HOST is not set $where"; ok=0; }
          [ -n "$KEY" ] || { echo "::error::Repository secret LIGHTSAIL_SSH_KEY is not set $where"; ok=0; }
          [ -n "$PGPASS" ] || { echo "::error::Repository secret POSTGRES_PASSWORD is not set $where"; ok=0; }
          if [ "$AUTH_MODE" != dev ] && [ -z "$CLERK" ]; then echo "::error::Repository secret CLERK_SECRET_KEY is not set and AUTH_MODE is not dev $where"; ok=0; fi
          [ "$ok" = 1 ]

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<CFG
          Host lightsail
            HostName ${{ secrets.LIGHTSAIL_HOST }}
            User ${{ vars.LIGHTSAIL_USER || 'ubuntu' }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          CFG

      - name: Prepare the server (first run only does anything)
        run: |
          ssh lightsail 'bash -s' <<'PREP'
          set -e
          if ! command -v docker >/dev/null 2>&1; then
            echo "Installing Docker"
            curl -fsSL https://get.docker.com | sudo sh
            sudo usermod -aG docker "$USER"
          fi
          if ! sudo swapon --show | grep -q /swapfile; then
            echo "Adding a 1 GB swap file"
            sudo fallocate -l 1G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
            grep -q /swapfile /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null
          fi
          sudo mkdir -p /opt/wellbeing/db
          sudo chown -R "$USER:$USER" /opt/wellbeing
          PREP

      - name: Copy compose file and database init script
        run: |
          scp docker-compose.prod.yml lightsail:/opt/wellbeing/docker-compose.yml
          scp deploy/db/init.sql lightsail:/opt/wellbeing/db/init.sql

      - name: Write the server env file from the repository secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTH_MODE: ${{ vars.AUTH_MODE || 'clerk' }}
          EXTRA_ENV: ${{ vars.EXTRA_ENV }}
        run: |
          {
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'AUTH_MODE=%s\n' "$AUTH_MODE"
            printf 'CLERK_SECRET_KEY=%s\n' "$CLERK_SECRET_KEY"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            [ -z "$EXTRA_ENV" ] || printf '%s\n' "$EXTRA_ENV"
          } | ssh lightsail 'umask 077 && cat > /opt/wellbeing/.env'

      # `sg docker` runs each command with the docker group, which a session opened before the
      # group was granted (the very first run) would otherwise lack.
      - name: Log the server in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh lightsail "sg docker -c \"docker login ghcr.io -u '${{ github.actor }}' --password-stdin\""

      - name: Pull the new image and restart
        run: ssh lightsail 'cd /opt/wellbeing && sg docker -c "docker compose pull app && docker compose up -d --remove-orphans"'

      - name: Push the database schema
        run: ssh lightsail 'cd /opt/wellbeing && sg docker -c "docker compose exec -T app npm run db:push -w api -- --force"'

      - name: Health check
        run: ssh lightsail 'for i in $(seq 1 20); do curl -fsS http://localhost/health && exit 0; sleep 3; done; sg docker -c "docker compose -f /opt/wellbeing/docker-compose.yml logs app --tail 50"; exit 1'

      - name: Remove old images
        run: ssh lightsail 'sg docker -c "docker image prune -af" >/dev/null'
