# Builds the app image, pushes it to GitHub's container registry, then deploys it to the
# Lightsail instance over SSH. Why it is shaped this way: docs/architecture/deployment.md.
#
# Repository settings this needs:
#   Secrets:   LIGHTSAIL_HOST (the static IP), LIGHTSAIL_SSH_KEY (private key of the deploy key pair)
#   Variables: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY (Clerk's publishable key; leave unset for the
#              built-in dev sign-in), LIGHTSAIL_USER (optional, default ubuntu)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry names must be lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            EXPO_PUBLIC_API_URL=
            EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Lightsail
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy settings exist
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          ok=1
          [ -n "$HOST" ] || { echo "::error::Repository secret LIGHTSAIL_HOST is not set (Settings → Secrets and variables → Actions → Repository secrets)"; ok=0; }
          [ -n "$KEY" ] || { echo "::error::Repository secret LIGHTSAIL_SSH_KEY is not set (Settings → Secrets and variables → Actions → Repository secrets)"; ok=0; }
          [ "$ok" = 1 ]

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<CFG
          Host lightsail
            HostName ${{ secrets.LIGHTSAIL_HOST }}
            User ${{ vars.LIGHTSAIL_USER || 'ubuntu' }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          CFG

      - name: Copy compose file and database init script
        run: |
          ssh lightsail 'mkdir -p /opt/wellbeing/db'
          scp docker-compose.prod.yml lightsail:/opt/wellbeing/docker-compose.yml
          scp deploy/db/init.sql lightsail:/opt/wellbeing/db/init.sql

      - name: Log the server in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh lightsail "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Pull the new image and restart
        run: ssh lightsail 'cd /opt/wellbeing && docker compose pull app && docker compose up -d --remove-orphans'

      - name: Push the database schema
        run: ssh lightsail 'cd /opt/wellbeing && docker compose exec -T app npm run db:push -w api -- --force'

      - name: Health check
        run: ssh lightsail 'for i in $(seq 1 20); do curl -fsS http://localhost/health && exit 0; sleep 3; done; docker compose -f /opt/wellbeing/docker-compose.yml logs app --tail 50; exit 1'

      - name: Remove old images
        run: ssh lightsail 'docker image prune -af >/dev/null'
